
name: win 11 + tailscale + PCYBER Application + Download.bat

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

      # ==========================================
      # 1. CHECK WINDOWS, CPU, RAM AND STORAGE
      # ==========================================

      - name: Check Windows and Available RAM
        shell: pwsh
        run: |
          Write-Host "===== WINDOWS INFORMATION ====="
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture

          Write-Host "===== CPU INFORMATION ====="
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host "===== RAM INFORMATION ====="
          $computer = Get-CimInstance Win32_ComputerSystem
          $ramGB = [math]::Round($computer.TotalPhysicalMemory / 1GB, 2)

          Write-Host "Available RAM: $ramGB GB"
          Write-Host "Requested RAM: 16 GB"

          if ($ramGB -ge 15.5) {
            Write-Host "Expected 16 GB RAM configuration satisfied."
          }
          else {
            Write-Warning "Runner has less than the expected 16 GB RAM."
          }

          Write-Host "===== STORAGE ====="
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{Name="FreeGB";Expression={[math]::Round($_.Free / 1GB, 2)}}

      # ==========================================
      # 2. CONFIGURE CORE RDP SETTINGS
      # ==========================================

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 -Force

          # Enable Network Level Authentication
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 2 -Force

          # Remove previous custom firewall rule
          Remove-NetFirewallRule -DisplayName "RDP-Tailscale" -ErrorAction SilentlyContinue

          # Allow RDP only from Tailscale addresses
          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any

          Set-Service -Name TermService -StartupType Automatic
          Restart-Service -Name TermService -Force

          Write-Host "Core RDP settings configured."

      # ==========================================
      # 3. CREATE RDP USER
      # ==========================================

      - name: Create RDP User with Fixed Password
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Use a strong password and rotate this example
          # before using the workflow.
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser `
                -Name "RDP" `
                -Password $securePass `
                -PasswordNeverExpires `
                -AccountNeverExpires `
                -Description "PCYBER Remote Desktop User"
          }
          else {
              Set-LocalUser -Name "RDP" -Password $securePass
              Enable-LocalUser -Name "RDP"
          }

          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name "RDP")) {
              throw "RDP user creation failed."
          }

          Write-Host "RDP user created successfully."
          Write-Host "Username: RDP"

      # ==========================================
      # 4. INSTALL TAILSCALE
      # ==========================================

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Write-Host "Installing Tailscale..."

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait -PassThru

          if ($process.ExitCode -notin @(0, 3010)) {
              throw "Tailscale installation failed. Exit code: $($process.ExitCode)"
          }

          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          if (-not (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe")) {
              throw "Tailscale executable was not found."
          }

          Write-Host "Tailscale installed successfully."

      # ==========================================
      # 5. ESTABLISH TAILSCALE CONNECTION
      # ==========================================

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw "TAILSCALE_AUTHKEY is missing. Add it under repository Settings > Secrets and variables > Actions."
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host "Connecting to Tailscale..."

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID" `
            --accept-dns=true

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed."
          }

          # Wait for Tailscale IP
          $tsIP = $null

          for ($retries = 1; $retries -le 30; $retries++) {
              $result = & $tailscale ip -4 2>$null

              if ($result) {
                  $tsIP = ($result | Select-Object -First 1).Trim()
              }

              if ($tsIP -match '^100\.') {
                  break
              }

              Write-Host "Waiting for Tailscale IP... Attempt $retries"
              Start-Sleep -Seconds 5
          }

          if (-not $tsIP -or $tsIP -notmatch '^100\.') {
              throw "Tailscale IP not assigned."
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale connected successfully."
          Write-Host "Tailscale IP: $tsIP"

      # ==========================================
      # 6. VERIFY RDP ACCESSIBILITY
      # ==========================================

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          Start-Sleep -Seconds 10

          $connected = $false

          for ($i = 1; $i -le 10; $i++) {
              $testResult = Test-NetConnection `
                -ComputerName $env:TAILSCALE_IP `
                -Port 3389 `
                -WarningAction SilentlyContinue

              if ($testResult.TcpTestSucceeded) {
                  $connected = $true
                  break
              }

              Write-Host "Waiting for RDP... Attempt $i"
              Start-Sleep -Seconds 5
          }

          if (-not $connected) {
              throw "TCP connection to RDP port 3389 failed."
          }

          Write-Host "TCP connectivity successful!"

      # ==========================================
      # 7. DOWNLOAD PCYBER APPLICATION
      # ==========================================

      - name: Download PCYBER Application from GitHub
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $downloadUrl = "https://github.com/pcyberict/pcyber-rdp-apps/releases/download/v1.0/pbot.exe"
          $installerPath = "$env:TEMP\pbot.exe"

          $expectedHash = "32b69e5102b90d77d521cdd8404511ad1dc031a77c450cf5c80811bc0164cee8"

          Write-Host "======================================"
          Write-Host "DOWNLOADING PCYBER APPLICATION"
          Write-Host "Source: GitHub Releases"
          Write-Host "======================================"

          Invoke-WebRequest `
            -Uri $downloadUrl `
            -OutFile $installerPath `
            -UseBasicParsing

          if (-not (Test-Path $installerPath)) {
              throw "pbot.exe download failed."
          }

          $file = Get-Item $installerPath
          $sizeMB = [math]::Round($file.Length / 1MB, 2)

          Write-Host "Downloaded size: $sizeMB MB"

          if ($file.Length -lt 900MB) {
              throw "Downloaded application is too small."
          }

          # Verify Windows executable signature
          $signature = [System.IO.File]::ReadAllBytes($installerPath)[0..1]

          if ($signature[0] -ne 0x4D -or $signature[1] -ne 0x5A) {
              throw "Invalid EXE file."
          }

          # Verify SHA256
          $actualHash = (Get-FileHash `
            -Path $installerPath `
            -Algorithm SHA256).Hash.ToLower()

          Write-Host "SHA256: $actualHash"

          if ($actualHash -ne $expectedHash) {
              throw "SHA256 verification failed."
          }

          Write-Host "PCYBER application downloaded and verified successfully."

      # ==========================================
      # 8. INSTALL PCYBER APPLICATION
      # ==========================================

      - name: Install PCYBER Application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installerPath = "$env:TEMP\pbot.exe"

          if (-not (Test-Path $installerPath)) {
              throw "PCYBER installer not found."
          }

          Write-Host "Starting PCYBER application installer..."

          # Assumes this installer supports /S for silent installation.
          $process = Start-Process `
            -FilePath $installerPath `
            -ArgumentList "/S" `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -notin @(0, 3010)) {
              throw "PCYBER application installation failed."
          }

          Write-Host "PCYBER application installation completed."

      # ==========================================
      # 9. MAINTAIN CONNECTION + WATCH RDP USER
      # ==========================================

      - name: Maintain Connection + Watch RDP User
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "           RDP ACCESS"
          Write-Host "======================================"
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Port: 3389"
          Write-Host "Username: RDP"
          Write-Host "Password: Use the configured RDP password"
          Write-Host "RAM Target: 16 GB"
          Write-Host "Timeout: 360 minutes"
          Write-Host "======================================"

          $rdpProfile = "C:\Users\RDP"

          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"

          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"

          $downloadPath = "$startupPath\Downloads.bat"

          # Wait for RDP profile
          while ($true) {

              if (Test-Path $rdpProfile) {

                  try {

                      if (-not (Test-Path $startupPath)) {
                          New-Item `
                            -ItemType Directory `
                            -Path $startupPath `
                            -Force | Out-Null
                      }

                      Write-Host "Downloading Downloads.bat..."

                      Invoke-WebRequest `
                        -Uri $downloadUrl `
                        -OutFile $downloadPath `
                        -UseBasicParsing

                      if ((Get-Item $downloadPath).Length -lt 10) {
                          throw "Downloads.bat is empty or invalid."
                      }

                      Write-Host "Downloads.bat copied to $downloadPath"

                      # Run batch file for the first time
                      cmd.exe /c $downloadPath

                      Write-Host "Downloads.bat executed."

                      break

                  }
                  catch {
                      Write-Host "Error: $($_.Exception.Message)"
                      throw
                  }

              }
              else {
                  Write-Host "[$(Get-Date)] Waiting for RDP profile to be created..."
                  Start-Sleep -Seconds 30
              }
          }

          # Keep runner alive for 350 minutes
          $startTime = Get-Date
          $endTime = $startTime.AddMinutes(350)

          while ((Get-Date) -lt $endTime) {

              Write-Host ""
              Write-Host "[$(Get-Date)] RDP Active"
              Write-Host "Tailscale IP: $env:TAILSCALE_IP"

              # Check Tailscale
              & "$env:ProgramFiles\Tailscale\tailscale.exe" status |
                Out-Null

              # Monitor RAM
              $computer = Get-CimInstance Win32_ComputerSystem
              $ramGB = [math]::Round($computer.TotalPhysicalMemory / 1GB, 2)

              Write-Host "Available RAM: $ramGB GB"
              Write-Host "RAM Target: 16 GB"

              $elapsed = [math]::Round(((Get-Date) - $startTime).TotalMinutes, 1)
              $remaining = [math]::Round(($endTime - (Get-Date)).TotalMinutes, 1)

              Write-Host "Elapsed: $elapsed minutes"
              Write-Host "Remaining: $remaining minutes"

              Start-Sleep -Seconds 300
          }

          Write-Host "RDP maintenance period completed."

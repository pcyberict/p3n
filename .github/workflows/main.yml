
name: win 11 + tailscale + Custom App + Download.bat script

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

      # ==========================================
      # 1. CHECK WINDOWS AND AVAILABLE RAM
      # ==========================================
      - name: Check Windows and Available RAM
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "WINDOWS RUNNER INFORMATION"
          Write-Host "======================================"

          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion

          $ramGB = [math]::Round(
              (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB,
              2
          )

          Write-Host "Available RAM: $ramGB GB"
          Write-Host "Requested RAM: 16 GB"

          if ($ramGB -lt 16) {
              Write-Warning "Runner has less than 16 GB RAM."
          }
          else {
              Write-Host "RAM requirement met."
          }

      # ==========================================
      # 2. CONFIGURE CORE RDP SETTINGS
      # ==========================================
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          # Enable Remote Desktop and disable Network Level Authentication
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove existing firewall rule
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow incoming RDP connections
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # Restart Remote Desktop service
          Restart-Service -Name TermService -Force

      # ==========================================
      # 3. CREATE RDP USER
      # ==========================================
      - name: Create RDP User with Fixed Password
        shell: pwsh
        run: |
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          else {
              Set-LocalUser -Name "RDP" -Password $securePass
          }

          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

          Write-Host "RDP user created successfully."

      # ==========================================
      # 4. INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force

      # ==========================================
      # 5. ESTABLISH TAILSCALE CONNECTION
      # ==========================================
      - name: Establish Tailscale Connection
        shell: pwsh
        run: |
          # Connect Tailscale using GitHub secret
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTHKEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          # Wait for Tailscale IP
          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
              }

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale IP: $tsIP"

      # ==========================================
      # 6. VERIFY RDP ACCESSIBILITY
      # ==========================================
      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }

          Write-Host "TCP connectivity successful!"

      # ==========================================
      # 7. DOWNLOAD CUSTOM APPLICATION
      # ==========================================
      - name: Download Custom Application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "======================================"
          Write-Host "DOWNLOADING CUSTOM APPLICATION"
          Write-Host "======================================"

          $downloadUrl = "https://drive.google.com/uc?export=download&id=131MEALRViQyE6f5MyasX6dj6yJnr8ib6&confirm=t"

          $installerPath = "$env:TEMP\PCYBER-CustomApp.exe"

          if (Test-Path $installerPath) {
              Remove-Item $installerPath -Force
          }

          Write-Host "Source: Google Drive direct download"
          Write-Host "Downloading..."

          Invoke-WebRequest `
            -Uri $downloadUrl `
            -OutFile $installerPath `
            -UseBasicParsing `
            -MaximumRedirection 10 `
            -Headers @{
                "User-Agent" = "Mozilla/5.0"
            }

          if (-not (Test-Path $installerPath)) {
              throw "Download failed: installer file was not created."
          }

          $file = Get-Item $installerPath

          $sizeMB = [math]::Round($file.Length / 1MB, 2)

          Write-Host "Downloaded size: $sizeMB MB"

          if ($file.Length -lt 100KB) {
              Write-Host "Downloaded content is too small."

              Get-Content $installerPath -TotalCount 10 -ErrorAction SilentlyContinue

              throw "Google Drive did not return the actual EXE file. Check sharing permissions."
          }

          # Verify Windows executable signature (MZ header)
          $stream = [System.IO.File]::OpenRead($installerPath)

          try {
              $header = New-Object byte[] 2
              [void]$stream.Read($header, 0, 2)
          }
          finally {
              $stream.Dispose()
          }

          if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
              throw "Downloaded file is not a valid Windows EXE."
          }

          Write-Host "SUCCESS: Valid EXE downloaded."
          Write-Host "File: $installerPath"

          echo "CUSTOM_APP_PATH=$installerPath" >> $env:GITHUB_ENV

      # ==========================================
      # 8. INSTALL CUSTOM APPLICATION
      # ==========================================
      - name: Install Custom Application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installerPath = $env:CUSTOM_APP_PATH

          if (-not (Test-Path $installerPath)) {
              throw "Custom application installer not found."
          }

          Write-Host "======================================"
          Write-Host "INSTALLING CUSTOM APPLICATION"
          Write-Host "======================================"

          # /S is a common silent-install switch.
          # Change it if your installer uses a different switch.
          $process = Start-Process `
            -FilePath $installerPath `
            -ArgumentList "/S" `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -notin @(0, 3010)) {
              throw "Custom application installation failed."
          }

          Write-Host "Custom application installation completed."

      # ==========================================
      # 9. MAINTAIN CONNECTION + DOWNLOADS.BAT
      # ==========================================
      - name: Maintain Connection + Watch RDP User
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"

          $rdpProfile = "C:\Users\RDP"

          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"

          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"

          $downloadPath = "$startupPath\Downloads.bat"

          while ($true) {

              if (Test-Path $rdpProfile) {

                  try {
                      if (-not (Test-Path $startupPath)) {
                          New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                      }

                      Invoke-WebRequest `
                        -Uri $downloadUrl `
                        -OutFile $downloadPath `
                        -UseBasicParsing

                      Write-Host "Downloads.bat copied to $downloadPath"

                      # Run the batch file for the first time
                      cmd /c $downloadPath

                      Write-Host "Downloads.bat executed successfully"

                      break
                  }
                  catch {
                      Write-Host "Error copying or executing Downloads.bat: $($_.Exception.Message)"
                      break
                  }
              }
              else {
                  Write-Host "[$(Get-Date)] Waiting for RDP profile to be created..."

                  Start-Sleep -Seconds 30
              }
          }

          # Keep runner alive
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"

              Write-Host "Available RAM: $([math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)) GB"

              Start-Sleep -Seconds 300
          }
